[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mangapy"
version = "4.0.1"
description = "Manga downloader"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Alessandro Marzoli", email = "alessandromarzoli@gmail.com"}]
urls = {Homepage = "https://github.com/alemar11/mangapy"}
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Intended Audience :: End Users/Desktop",
]
dependencies = [
  "beautifulsoup4>=4.15.0",
  "img2pdf>=0.6.3",
  "pikepdf>=10.5.0",
  "pillow>=12.0.0",
  "pyyaml>=6.0.3",
  "requests>=2.34.2",
  "tqdm>=4.68.3",
]

[project.scripts]
mangapy = "mangapy.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "rope>=1.14.0",
  "ruff>=0.16.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mangapy*"]

[tool.ruff]
target-version = "py314"
line-length = 130

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = [
  "live: tests that contact real providers and require network access",
]
