[package]
name = "mangapy"
version = "4.1.2"
edition = "2024"
rust-version = "1.91"
publish = false
readme = "README.md"
repository = "https://github.com/alemar11/mangapy"
exclude = ["/.github", "/.vscode", "/dist", "/downloads", "/*.egg-info", "/mangapy", "/.venv", "**/__pycache__"]
license = "MIT"
description = "Manga downloader for FanFox and MangaDex"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
indicatif = "0.18"
lopdf = { version = "0.39", default-features = false }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip"] }
scraper = "0.24"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
sha2 = "0.10"
same-file = "1"
unicode-normalization = "0.1"
caseless = "0.2"
percent-encoding = "2"
