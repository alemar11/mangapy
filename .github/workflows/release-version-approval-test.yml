# Configure the release-approval-test environment with a required reviewer
# before dispatching this workflow. This workflow never mutates repository refs.
name: Release version (approval test)

run-name: Approval test · ${{ inputs.operation }} · ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Select the operation that matches the branch chosen above
        required: true
        type: choice
        options:
          - "[patch] Default branch → vX.Y.(Z+1)-rc.1"
          - "[minor] Default branch → vX.(Y+1).0-rc.1"
          - "[major] Default branch → v(X+1).0.0-rc.1"
          - "[candidate] release/vX.Y.Z → vX.Y.Z-rc.N"
          - "[final] release/vX.Y.Z → vX.Y.Z"

permissions: {}

concurrency:
  group: release-version-approval-test-${{ github.repository }}
  cancel-in-progress: true

jobs:
  plan:
    name: Resolve requested operation
    uses: ./.github/workflows/release-version-dry-run.yml
    with:
      application_mode: false
      operation: ${{ inputs.operation }}
      ref_name: ${{ github.ref_name }}
      target_sha: ${{ github.sha }}
    permissions:
      contents: read

  approval:
    name: Approve proposed tag ${{ needs.plan.outputs.tag }}
    needs: plan
    if: ${{ needs.plan.outputs.status == 'proposal-ready' }}
    runs-on: ubuntu-latest
    environment:
      name: release-approval-test
      deployment: false
    steps:
      - name: Record approved proposal
        env:
          CONTEXT: ${{ needs.plan.outputs.context }}
          KIND: ${{ needs.plan.outputs.kind }}
          RELEASE_BRANCH: ${{ needs.plan.outputs.release_branch }}
          TAG: ${{ needs.plan.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Approval test completed"
            echo
            echo "- Proposed tag: \`$TAG\`"
            echo "- Kind: \`$KIND\`"
            echo "- Context: \`$CONTEXT\`"
            echo "- Release branch: \`$RELEASE_BRANCH\`"
            echo "- Target commit: \`$TARGET_SHA\`"
            echo
            echo "The approval was recorded. No tag, branch, release, pull request, package, or deployment was created or modified."
          } >> "$GITHUB_STEP_SUMMARY"
