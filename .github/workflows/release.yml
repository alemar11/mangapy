name: Publish tagged release

run-name: Publish · ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish or retry
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: >-
      (github.event_name == 'push' && github.event.created) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check the release commit and Cargo version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if [[ "$EVENT_NAME" == push ]]; then
            test "$(git rev-parse HEAD)" = "$(git rev-parse "$EVENT_SHA^{commit}")"
          fi
          rustup update stable
          version="$(cargo +stable pkgid --locked | sed 's/.*[#@]//')"
          test "$TAG" = "v$version"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Test and package binary
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export SOURCE_DATE_EPOCH
          cargo +stable test --locked --all-targets
          if [[ "$RUNNER_OS" == Linux ]]; then
            uvx --from 'maturin[zig]>=1.9,<2' maturin build --release --locked --strip --target "$TARGET" --zig --compatibility manylinux_2_28 --out out
          else
            uvx --from 'maturin>=1.9,<2' maturin build --release --locked --strip --target "$TARGET" --out out
          fi
          if [[ "$TARGET" == x86_64-unknown-linux-gnu ]]; then
            uvx --from 'maturin>=1.9,<2' maturin sdist --out out
          fi
          uv run --no-project python -m zipfile -e out/*.whl unpacked
          mkdir bundle
          if [[ "$RUNNER_OS" == Windows ]]; then
            mv unpacked/*.data/scripts/mangapy.exe bundle/
            ./bundle/mangapy.exe --version
          else
            mv unpacked/*.data/scripts/mangapy bundle/
            chmod +x bundle/mangapy
            ./bundle/mangapy --version
          fi
          cp LICENSE README.md bundle/
          tar -czf "out/mangapy-${TAG#v}-${TARGET}.tar.gz" -C bundle .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mangapy-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: >-
      (github.event_name == 'push' && github.event.created) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      id-token: write
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate tag name
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vX.Y.Z tag, got $TAG." >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push && "$(git rev-parse HEAD)" != "$(git rev-parse "$EVENT_SHA^{commit}")" ]]; then
            echo "The tag no longer points to the pushed commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The release tag must point to a commit on main." >&2
            exit 1
          fi

      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: mangapy-*
          merge-multiple: true
          path: artifacts

      - name: Read release metadata
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "archive_url=https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          branch="release/${TAG}"
          ref="refs/heads/${branch}"
          commit="$(git rev-parse HEAD)"
          existing_commit() {
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${branch}" \
              --jq ".[] | select(.ref == \"${ref}\") | .object.sha"
          }

          current="$(existing_commit)"
          if [[ -z "$current" ]]; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              --raw-field ref="$ref" --raw-field sha="$commit" --silent; then
              exit 0
            fi
            current="$(existing_commit)"
          fi
          if [[ "$current" != "$commit" ]]; then
            echo "Expected ${ref} at ${commit}, found ${current:-no branch}." >&2
            exit 1
          fi

      - name: Publish to PyPI
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          package_dir="$(mktemp -d)"
          cp artifacts/*.whl "artifacts/mangapy-${VERSION}.tar.gz" "$package_dir/"
          uv publish --trusted-publishing automatic --check-url https://pypi.org/simple/ "$package_dir/"*

      - name: Publish native archives to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          assets=(artifacts/mangapy-"$VERSION"-*.tar.gz)
          if published="$(gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null)"; then
            for asset in "${assets[@]}"; do
              if ! grep -Fxq "${asset##*/}" <<< "$published"; then
                gh release upload "$TAG" "$asset"
              fi
            done
          else
            gh release create "$TAG" "${assets[@]}" --verify-tag --generate-notes
          fi

      - name: Compute source archive checksum
        id: archive
        env:
          ARCHIVE_URL: ${{ steps.meta.outputs.archive_url }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "${ARCHIVE_URL}" \
            --output "mangapy-${VERSION}.tar.gz"
          sha256="$(shasum -a 256 "mangapy-${VERSION}.tar.gz" | awk '{print $1}')"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Check out Homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: alemar11/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Prepare Homebrew formula branch
        id: homebrew
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          branch="automation/mangapy-v${VERSION}"
          git fetch origin main
          git fetch origin \
            "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git switch --force-create "${branch}" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Write Rust Homebrew formula
        working-directory: homebrew-tap
        env:
          ARCHIVE_URL: ${{ steps.meta.outputs.archive_url }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p Formula
          if [[ -f Formula/mangapy.rb ]] &&
            grep -Fqx "  url \"${ARCHIVE_URL}\"" Formula/mangapy.rb &&
            grep -Fqx "  sha256 \"${ARCHIVE_SHA256}\"" Formula/mangapy.rb &&
            grep -Fq "std_cargo_args" Formula/mangapy.rb; then
            exit 0
          fi
          cat > Formula/mangapy.rb <<RUBY
          class Mangapy < Formula
            desc "Manga downloader"
            homepage "https://github.com/alemar11/mangapy"
            url "${ARCHIVE_URL}"
            sha256 "${ARCHIVE_SHA256}"
            license "MIT"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mangapy --version")
            end
          end
          RUBY
          ruby -c Formula/mangapy.rb

      - name: Open or update Homebrew formula pull request
        working-directory: homebrew-tap
        env:
          BRANCH: ${{ steps.homebrew.outputs.branch }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          changed_files="$(git status --short | awk '{print $2}')"
          if [[ -n "${changed_files}" && "${changed_files}" != "Formula/mangapy.rb" ]]; then
            echo "Refusing to publish unexpected Homebrew changes:" >&2
            printf '%s\n' "${changed_files}" >&2
            exit 1
          fi

          git add Formula/mangapy.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi

          git commit -m "Update mangapy to ${VERSION}"
          git push --force-with-lease="refs/heads/${BRANCH}" origin "HEAD:${BRANCH}"

          pr_number="$(
            gh pr list \
              --repo alemar11/homebrew-tap \
              --base main \
              --head "${BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "${pr_number}" ]]; then
            pr_url="$(
              gh pr create \
                --repo alemar11/homebrew-tap \
                --base main \
                --head "${BRANCH}" \
                --title "Update mangapy to ${VERSION}" \
                --body "Automated formula update for mangapy v${VERSION}. Leave this pull request open for brew pr-pull. After Homebrew test-bot passes, brew pr-pull publishes the bottle and pushes the updated formula to main."
            )"
            pr_number="${pr_url##*/}"
          fi

          head_sha="$(git rev-parse HEAD)"
          read -r actual_base actual_head actual_sha state is_draft < <(
            gh pr view "${pr_number}" \
              --repo alemar11/homebrew-tap \
              --json baseRefName,headRefName,headRefOid,state,isDraft \
              --jq '[.baseRefName, .headRefName, .headRefOid, .state, .isDraft] | @tsv'
          )
          if [[ "${actual_base}" != "main" || "${actual_head}" != "${BRANCH}" ||
            "${actual_sha}" != "${head_sha}" || "${state}" != "OPEN" ||
            "${is_draft}" != "false" ]]; then
            echo "Homebrew pull request does not match the published formula commit." >&2
            exit 1
          fi

          pr_files="$(
            gh api --paginate \
              "repos/alemar11/homebrew-tap/pulls/${pr_number}/files" \
              --jq '.[].filename'
          )"
          if [[ "${pr_files}" != "Formula/mangapy.rb" ]]; then
            echo "Homebrew pull request contains unexpected files." >&2
            printf '%s\n' "${pr_files}" >&2
            exit 1
          fi
          echo "Homebrew formula pull request: https://github.com/alemar11/homebrew-tap/pull/${pr_number}"
