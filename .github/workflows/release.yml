name: Publish tagged release

run-name: Publish · ${{ inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish or retry
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'push' && github.event.created) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    permissions:
      contents: write
      id-token: write
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash

    steps:
      - name: Validate tag name
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable vX.Y.Z tag, got $TAG." >&2
            exit 1
          fi
          echo "name=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: refs/tags/${{ steps.tag.outputs.name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release commit
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == push && "$(git rev-parse HEAD)" != "$(git rev-parse "$EVENT_SHA^{commit}")" ]]; then
            echo "The tag no longer points to the pushed commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "The release tag must point to a commit on main." >&2
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Validate release tag
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          version="${tag#v}"
          project_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "${version}" != "${project_version}" ]]; then
            echo "Tag ${version} does not match pyproject.toml version ${project_version}" >&2
            exit 1
          fi
          archive_url="https://github.com/alemar11/mangapy/archive/refs/tags/${tag}.tar.gz"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive_url=${archive_url}" >> "${GITHUB_OUTPUT}"

      - name: Check lockfile
        run: uv lock --check

      - name: Run offline tests
        run: uv run --locked pytest -q -m "not live"

      - name: Build distributions
        run: uv build

      - name: Create release branch
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          branch="release/${TAG}"
          ref="refs/heads/${branch}"
          commit="$(git rev-parse HEAD)"
          existing_commit() {
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${branch}" \
              --jq ".[] | select(.ref == \"${ref}\") | .object.sha"
          }

          current="$(existing_commit)"
          if [[ -z "$current" ]]; then
            if gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              --raw-field ref="$ref" --raw-field sha="$commit" --silent; then
              exit 0
            fi
            current="$(existing_commit)"
          fi
          if [[ "$current" != "$commit" ]]; then
            echo "Expected ${ref} at ${commit}, found ${current:-no branch}." >&2
            exit 1
          fi

      - name: Publish to PyPI
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          index_url="https://pypi.org/simple/mangapy/"
          index="$(curl --fail --location --silent --show-error "${index_url}")"
          if grep -Fq "mangapy-${VERSION}-py3-none-any.whl" <<< "${index}" &&
            grep -Fq "mangapy-${VERSION}.tar.gz" <<< "${index}"; then
            echo "mangapy ${VERSION} is already published on PyPI; skipping upload."
          else
            uv publish --trusted-publishing automatic --check-url https://pypi.org/simple/
          fi

      - name: Compute source archive checksum
        id: archive
        env:
          ARCHIVE_URL: ${{ steps.meta.outputs.archive_url }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "${ARCHIVE_URL}" \
            --output "mangapy-${VERSION}.tar.gz"
          sha256="$(shasum -a 256 "mangapy-${VERSION}.tar.gz" | awk '{print $1}')"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Check out Homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: alemar11/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Prepare Homebrew formula branch
        id: homebrew
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          branch="automation/mangapy-v${VERSION}"
          git fetch origin main
          git fetch origin \
            "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git switch --force-create "${branch}" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Trust Homebrew formula
        run: brew trust --formula alemar11/tap/mangapy

      - name: Update Homebrew formula
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          tap_root="$(brew --repository)/Library/Taps/alemar11"
          mkdir -p "${tap_root}"
          rm -rf "${tap_root}/homebrew-tap"
          ln -s "${PWD}" "${tap_root}/homebrew-tap"
          formula_path="${tap_root}/homebrew-tap/Formula/mangapy.rb"
          mkdir -p Formula
          if [[ ! -f Formula/mangapy.rb ]]; then
            cat > Formula/mangapy.rb <<'RUBY'
          class Mangapy < Formula
            include Language::Python::Virtualenv

            desc "Manga downloader"
            homepage "https://github.com/alemar11/mangapy"
            url "__ARCHIVE_URL__"
            sha256 "__ARCHIVE_SHA256__"
            license "MIT"

            depends_on "libyaml"
            depends_on "pillow"
            depends_on "python@3.14"
            depends_on "qpdf"

            uses_from_macos "libxml2", since: :ventura
            uses_from_macos "libxslt"

            def install
              virtualenv_install_with_resources using: "python@3.14"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mangapy --version")
            end
          end
          RUBY
          fi
          ruby <<'RUBY'
            path = "Formula/mangapy.rb"
            formula = File.read(path)
            archive_url = ENV.fetch("ARCHIVE_URL")
            previous_url = formula[%r{^  url "(https://github.com/alemar11/mangapy/archive/refs/tags/[^"]+[.]tar[.]gz)"$}, 1]
            if previous_url && previous_url != archive_url
              formula = formula.sub(/^  bottle do\n.*?^  end\n\n?/m, "")
            end
            formula = formula.sub(%r{url "https://github.com/alemar11/mangapy/archive/refs/tags/[^"]+[.]tar[.]gz"}, %(url "#{archive_url}"))
            formula = formula.sub(/sha256 "[0-9a-f]{64}"/, %(sha256 "#{ENV.fetch("ARCHIVE_SHA256")}"))
            formula = formula.gsub("__ARCHIVE_URL__", ENV.fetch("ARCHIVE_URL"))
            formula = formula.gsub("__ARCHIVE_SHA256__", ENV.fetch("ARCHIVE_SHA256"))
            formula = formula.gsub(/python@3[.]\d+/, "python@3.14")
            unless formula.include?('depends_on "qpdf"')
              formula = formula.sub(/(  depends_on "python@3[.]\d+"\n)/, %(\\1  depends_on "qpdf"\n))
            end
            macos_dependencies = []
            unless formula.include?('uses_from_macos "libxml2"')
              macos_dependencies << '  uses_from_macos "libxml2", since: :ventura'
            end
            unless formula.include?('uses_from_macos "libxslt"')
              macos_dependencies << '  uses_from_macos "libxslt"'
            end
            unless macos_dependencies.empty?
              formula = formula.sub(
                /(  depends_on "qpdf"\n)/,
                "\\1\n#{macos_dependencies.join("\n")}\n",
              )
            end
            File.write(path, formula)
          RUBY
          for attempt in 1 2 3 4 5 6; do
            if brew update-python-resources --ignore-main-package-cooldown --exclude-packages pillow --package-name mangapy --version "${VERSION}" "${formula_path}"; then
              exit 0
            fi
            echo "PyPI resources not available yet; retrying (${attempt}/6)"
            sleep 10
          done
          echo "Could not refresh Python resources after 6 attempts; refusing to publish stale dependencies." >&2
          exit 1
        env:
          ARCHIVE_URL: ${{ steps.meta.outputs.archive_url }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Open or update Homebrew formula pull request
        working-directory: homebrew-tap
        env:
          BRANCH: ${{ steps.homebrew.outputs.branch }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          changed_files="$(git status --short | awk '{print $2}')"
          if [[ -n "${changed_files}" && "${changed_files}" != "Formula/mangapy.rb" ]]; then
            echo "Refusing to publish unexpected Homebrew changes:" >&2
            printf '%s\n' "${changed_files}" >&2
            exit 1
          fi

          git add Formula/mangapy.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi

          git commit -m "Update mangapy to ${VERSION}"
          git push --force-with-lease="refs/heads/${BRANCH}" origin "HEAD:${BRANCH}"

          pr_number="$(
            gh pr list \
              --repo alemar11/homebrew-tap \
              --base main \
              --head "${BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "${pr_number}" ]]; then
            pr_url="$(
              gh pr create \
                --repo alemar11/homebrew-tap \
                --base main \
                --head "${BRANCH}" \
                --title "Update mangapy to ${VERSION}" \
                --body "Automated formula update for mangapy v${VERSION}. Leave this pull request open for brew pr-pull. After Homebrew test-bot passes, brew pr-pull publishes the bottle and pushes the updated formula to main."
            )"
            pr_number="${pr_url##*/}"
          fi

          head_sha="$(git rev-parse HEAD)"
          read -r actual_base actual_head actual_sha state is_draft < <(
            gh pr view "${pr_number}" \
              --repo alemar11/homebrew-tap \
              --json baseRefName,headRefName,headRefOid,state,isDraft \
              --jq '[.baseRefName, .headRefName, .headRefOid, .state, .isDraft] | @tsv'
          )
          if [[ "${actual_base}" != "main" || "${actual_head}" != "${BRANCH}" ||
            "${actual_sha}" != "${head_sha}" || "${state}" != "OPEN" ||
            "${is_draft}" != "false" ]]; then
            echo "Homebrew pull request does not match the published formula commit." >&2
            exit 1
          fi

          pr_files="$(
            gh api --paginate \
              "repos/alemar11/homebrew-tap/pulls/${pr_number}/files" \
              --jq '.[].filename'
          )"
          if [[ "${pr_files}" != "Formula/mangapy.rb" ]]; then
            echo "Homebrew pull request contains unexpected files." >&2
            printf '%s\n' "${pr_files}" >&2
            exit 1
          fi
          echo "Homebrew formula pull request: https://github.com/alemar11/homebrew-tap/pull/${pr_number}"
