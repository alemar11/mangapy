name: Publish tagged release

run-name: Publish · ${{ inputs.tag }}

on:
  workflow_call:
    inputs:
      tag:
        description: Exact existing final tag to publish
        required: true
        type: string
      source_sha:
        description: Exact commit approved by the release-version workflow
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing final tag to recover
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  resolve:
    name: Resolve final release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      application_ready: ${{ steps.resolve.outputs.application_ready }}
      is_final: ${{ steps.resolve.outputs.is_final }}
      tag: ${{ steps.resolve.outputs.tag }}
      tag_state: ${{ steps.resolve.outputs.tag_state }}
    steps:
      - name: Capture repository version state
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          tags_file="$RUNNER_TEMP/release-tags.txt"
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" \
            --jq '.[].ref | sub("^refs/tags/"; "")' \
            | LC_ALL=C sort -u > "$tags_file"

          default_branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          default_ref="refs/heads/${default_branch}"
          default_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/heads/${default_branch}" \
              | jq -r --arg default_ref "$default_ref" \
                '[.[] | select(.ref == $default_ref) | .object.sha][0] // empty'
          )"
          if [[ -z "$default_sha" ]]; then
            echo "Could not resolve the current default-branch commit." >&2
            exit 1
          fi

          tag_snapshot="$(sha256sum "$tags_file" | cut -d ' ' -f 1)"
          {
            echo "default_branch=$default_branch"
            echo "default_sha=$default_sha"
            echo "tag_snapshot=$tag_snapshot"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve exact existing final tag commit
        id: tag
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.source_sha }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail

          stable_tag_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$TAG" =~ $stable_tag_pattern ]]; then
            echo "Recovery and reusable publication require an exact existing vX.Y.Z tag." >&2
            exit 1
          fi

          read -r object_type object_sha < <(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" \
              --jq '[.object.type, .object.sha] | @tsv'
          )
          for _ in 1 2 3 4 5; do
            if [[ "$object_type" == "commit" ]]; then
              break
            fi
            if [[ "$object_type" != "tag" ]]; then
              echo "Unsupported tag target type: $object_type" >&2
              exit 1
            fi
            read -r object_type object_sha < <(
              gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}" \
                --jq '[.object.type, .object.sha] | @tsv'
            )
          done
          if [[ "$object_type" != "commit" ]]; then
            echo "$TAG does not resolve to a commit." >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_SOURCE_SHA" && "$object_sha" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "$TAG resolves to $object_sha, not approved commit $EXPECTED_SOURCE_SHA." >&2
            exit 1
          fi

          {
            echo "tag=$TAG"
            echo "source_sha=$object_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Check out only the trusted version resolver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.snapshot.outputs.default_sha }}
          sparse-checkout: .github/scripts/resolve_release_version.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
          fetch-depth: 1

      - name: Verify release resolver API version
        env:
          EXPECTED_RESOLVER_VERSION: "0.2.2"
        shell: bash
        run: |
          set -euo pipefail
          actual_version="$(python3 .github/scripts/resolve_release_version.py --version)"
          if [[ "$actual_version" != "$EXPECTED_RESOLVER_VERSION" ]]; then
            echo "Resolver version $actual_version does not match workflow API $EXPECTED_RESOLVER_VERSION." >&2
            exit 1
          fi

      - name: Resolve existing final tag
        id: resolve
        env:
          CONFIRMED_TAG: ${{ steps.tag.outputs.tag }}
          DEFAULT_BRANCH: ${{ steps.snapshot.outputs.default_branch }}
          REF_NAME: ${{ format('release/{0}', steps.tag.outputs.tag) }}
          TAG_SNAPSHOT: ${{ steps.snapshot.outputs.tag_snapshot }}
          TARGET_SHA: ${{ steps.tag.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/resolve_release_version.py \
            --application-mode \
            --confirmed-tag "$CONFIRMED_TAG" \
            --default-branch "$DEFAULT_BRANCH" \
            --github-output "$GITHUB_OUTPUT" \
            --github-step-summary "$GITHUB_STEP_SUMMARY" \
            --operation final \
            --ref-name "$REF_NAME" \
            --tag-snapshot "$TAG_SNAPSHOT" \
            --tags-file "$RUNNER_TEMP/release-tags.txt" \
            --target-sha "$TARGET_SHA"

  release:
    needs: resolve
    if: >-
      needs.resolve.outputs.application_ready == 'true' &&
      needs.resolve.outputs.is_final == 'true' &&
      needs.resolve.outputs.tag_state == 'existing-final'
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Validate release tag
        id: meta
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)[.](0|[1-9][0-9]*)[.](0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use final vX.Y.Z format, got ${tag}" >&2
            exit 1
          fi
          version="${tag#v}"
          project_version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "${version}" != "${project_version}" ]]; then
            echo "Tag ${version} does not match pyproject.toml version ${project_version}" >&2
            exit 1
          fi
          archive_url="https://github.com/alemar11/mangapy/archive/refs/tags/${tag}.tar.gz"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "archive_url=${archive_url}" >> "${GITHUB_OUTPUT}"

      - name: Check lockfile
        run: uv lock --check

      - name: Run offline tests
        run: uv run --locked pytest -q -m "not live"

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          index_url="https://pypi.org/simple/mangapy/"
          index="$(curl --fail --location --silent --show-error "${index_url}")"
          if grep -Fq "mangapy-${VERSION}-py3-none-any.whl" <<< "${index}" &&
            grep -Fq "mangapy-${VERSION}.tar.gz" <<< "${index}"; then
            echo "mangapy ${VERSION} is already published on PyPI; skipping upload."
          else
            uv publish --trusted-publishing automatic --check-url https://pypi.org/simple/
          fi

      - name: Compute source archive checksum
        id: archive
        env:
          ARCHIVE_URL: ${{ steps.meta.outputs.archive_url }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            "${ARCHIVE_URL}" \
            --output "mangapy-${VERSION}.tar.gz"
          sha256="$(shasum -a 256 "mangapy-${VERSION}.tar.gz" | awk '{print $1}')"
          echo "sha256=${sha256}" >> "${GITHUB_OUTPUT}"

      - name: Check out Homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: alemar11/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Prepare Homebrew formula branch
        id: homebrew
        working-directory: homebrew-tap
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          branch="automation/mangapy-v${VERSION}"
          git fetch origin main
          git fetch origin \
            "refs/heads/${branch}:refs/remotes/origin/${branch}" || true
          git switch --force-create "${branch}" origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      - name: Trust Homebrew formula
        run: brew trust --formula alemar11/tap/mangapy

      - name: Update Homebrew formula
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          tap_root="$(brew --repository)/Library/Taps/alemar11"
          mkdir -p "${tap_root}"
          rm -rf "${tap_root}/homebrew-tap"
          ln -s "${PWD}" "${tap_root}/homebrew-tap"
          formula_path="${tap_root}/homebrew-tap/Formula/mangapy.rb"
          mkdir -p Formula
          if [[ ! -f Formula/mangapy.rb ]]; then
            cat > Formula/mangapy.rb <<'RUBY'
          class Mangapy < Formula
            include Language::Python::Virtualenv

            desc "Manga downloader"
            homepage "https://github.com/alemar11/mangapy"
            url "__ARCHIVE_URL__"
            sha256 "__ARCHIVE_SHA256__"
            license "MIT"

            depends_on "libyaml"
            depends_on "pillow"
            depends_on "python@3.14"
            depends_on "qpdf"

            uses_from_macos "libxml2", since: :ventura
            uses_from_macos "libxslt"

            def install
              virtualenv_install_with_resources using: "python@3.14"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/mangapy --version")
            end
          end
          RUBY
          fi
          ruby <<'RUBY'
            path = "Formula/mangapy.rb"
            formula = File.read(path)
            formula = formula.sub(%r{url "https://github.com/alemar11/mangapy/archive/refs/tags/[^"]+[.]tar[.]gz"}, %(url "#{ENV.fetch("ARCHIVE_URL")}"))
            formula = formula.sub(/sha256 "[0-9a-f]{64}"/, %(sha256 "#{ENV.fetch("ARCHIVE_SHA256")}"))
            formula = formula.gsub("__ARCHIVE_URL__", ENV.fetch("ARCHIVE_URL"))
            formula = formula.gsub("__ARCHIVE_SHA256__", ENV.fetch("ARCHIVE_SHA256"))
            formula = formula.gsub(/python@3[.]\d+/, "python@3.14")
            unless formula.include?('depends_on "qpdf"')
              formula = formula.sub(/(  depends_on "python@3[.]\d+"\n)/, %(\\1  depends_on "qpdf"\n))
            end
            macos_dependencies = []
            unless formula.include?('uses_from_macos "libxml2"')
              macos_dependencies << '  uses_from_macos "libxml2", since: :ventura'
            end
            unless formula.include?('uses_from_macos "libxslt"')
              macos_dependencies << '  uses_from_macos "libxslt"'
            end
            unless macos_dependencies.empty?
              formula = formula.sub(
                /(  depends_on "qpdf"\n)/,
                "\\1\n#{macos_dependencies.join("\n")}\n",
              )
            end
            File.write(path, formula)
          RUBY
          for attempt in 1 2 3 4 5 6; do
            if brew update-python-resources --ignore-main-package-cooldown --exclude-packages pillow --package-name mangapy --version "${VERSION}" "${formula_path}"; then
              exit 0
            fi
            echo "PyPI resources not available yet; retrying (${attempt}/6)"
            sleep 10
          done
          echo "Could not refresh Python resources after 6 attempts; refusing to publish stale dependencies." >&2
          exit 1
        env:
          ARCHIVE_URL: ${{ steps.meta.outputs.archive_url }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
          VERSION: ${{ steps.meta.outputs.version }}

      - name: Open or update Homebrew formula pull request
        working-directory: homebrew-tap
        env:
          BRANCH: ${{ steps.homebrew.outputs.branch }}
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          changed_files="$(git status --short | awk '{print $2}')"
          if [[ -n "${changed_files}" && "${changed_files}" != "Formula/mangapy.rb" ]]; then
            echo "Refusing to publish unexpected Homebrew changes:" >&2
            printf '%s\n' "${changed_files}" >&2
            exit 1
          fi

          git add Formula/mangapy.rb
          if git diff --cached --quiet; then
            echo "Homebrew formula is already up to date."
            exit 0
          fi

          git commit -m "Update mangapy to ${VERSION}"
          git push --force-with-lease="refs/heads/${BRANCH}" origin "HEAD:${BRANCH}"

          pr_number="$(
            gh pr list \
              --repo alemar11/homebrew-tap \
              --base main \
              --head "${BRANCH}" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [[ -z "${pr_number}" ]]; then
            pr_url="$(
              gh pr create \
                --repo alemar11/homebrew-tap \
                --base main \
                --head "${BRANCH}" \
                --title "Update mangapy to ${VERSION}" \
                --body "Automated formula update for mangapy v${VERSION}. Homebrew test-bot validates the formula and publishes its bottles after this exact commit passes."
            )"
            pr_number="${pr_url##*/}"
          fi

          head_sha="$(git rev-parse HEAD)"
          read -r actual_base actual_head actual_sha state is_draft < <(
            gh pr view "${pr_number}" \
              --repo alemar11/homebrew-tap \
              --json baseRefName,headRefName,headRefOid,state,isDraft \
              --jq '[.baseRefName, .headRefName, .headRefOid, .state, .isDraft] | @tsv'
          )
          if [[ "${actual_base}" != "main" || "${actual_head}" != "${BRANCH}" ||
            "${actual_sha}" != "${head_sha}" || "${state}" != "OPEN" ||
            "${is_draft}" != "false" ]]; then
            echo "Homebrew pull request does not match the published formula commit." >&2
            exit 1
          fi

          pr_files="$(
            gh api --paginate \
              "repos/alemar11/homebrew-tap/pulls/${pr_number}/files" \
              --jq '.[].filename'
          )"
          if [[ "${pr_files}" != "Formula/mangapy.rb" ]]; then
            echo "Homebrew pull request contains unexpected files." >&2
            printf '%s\n' "${pr_files}" >&2
            exit 1
          fi
          echo "Homebrew formula pull request: https://github.com/alemar11/homebrew-tap/pull/${pr_number}"
